<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masuk - SekolahMu</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Tailwind CSS -->

    <!-- Theme Selector Script -->
    <script>
      (function() {
        const state = JSON.parse(localStorage.getItem('sekolahmu_state') || '{}');
        const theme = state['edu-level'] || localStorage.getItem('edu-level') || 'smk';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <script type="module" crossorigin src="/assets/login-B-QoJa6B.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/supabaseClient-Cru0LNVQ.js">
    <link rel="stylesheet" crossorigin href="/assets/supabaseClient-BGHx4CCw.css">
  </head>
  <body
    class="bg-surface-50 text-surface-900 font-sans antialiased min-h-screen flex items-center justify-center p-4 relative overflow-hidden"
  >
    <!-- Background dynamic mesh blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div
      class="w-full max-w-md glass-panel rounded-3xl p-8 sm:p-10 space-y-6 relative overflow-hidden"
    >
      <!-- Logo Area & Header -->
      <div class="text-center space-y-2">
        <div
          class="inline-flex items-center gap-2 text-accent-500 font-extrabold text-2xl tracking-tight font-display"
        >
          <i data-lucide="graduation-cap" class="w-8 h-8 text-accent-500"></i>
          <span>Sekolah<span class="text-surface-900">Mu</span></span>
        </div>
        <h1 id="login-title" class="text-3xl font-extrabold text-surface-900 tracking-tight font-display">
          Selamat Datang
        </h1>
        <p id="login-subtitle" class="text-surface-500 text-sm font-medium">
          Masuk untuk memulai perjalanan belajarmu hari ini!
        </p>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="space-y-5">
        <!-- Input Email -->
        <div class="space-y-1.5">
          <label for="email" class="text-xs font-bold uppercase tracking-wider text-surface-500"
            >Alamat Email</label
          >
          <div class="relative flex items-center">
            <i
              data-lucide="mail"
              class="w-4 h-4 absolute left-3.5 text-surface-400"
            ></i>
            <input
              type="email"
              id="email"
              required
              placeholder="Masukkan email Anda..."
              class="w-full pl-10 pr-4 py-3 bg-white/60 border border-surface-200/50 focus:border-accent-500 focus:ring-4 focus:ring-accent-100 rounded-xl text-sm outline-none transition-all shadow-sm"
            />
          </div>
        </div>

        <!-- Input Password -->
        <div class="space-y-1.5">
          <label for="password" class="text-xs font-bold uppercase tracking-wider text-surface-500"
            >Kata Sandi</label
          >
          <div class="relative flex items-center">
            <i
              data-lucide="lock"
              class="w-4 h-4 absolute left-3.5 text-surface-400"
            ></i>
            <input
              type="password"
              id="password"
              required
              placeholder="••••••••"
              class="w-full pl-10 pr-4 py-3 bg-white/60 border border-surface-200/50 focus:border-accent-500 focus:ring-4 focus:ring-accent-100 rounded-xl text-sm outline-none transition-all shadow-sm"
            />
          </div>
        </div>



        <!-- Submit Button -->
        <button
          type="submit"
          id="submit-btn"
          class="w-full py-3.5 bg-accent-500 hover:bg-accent-600 active:scale-98 text-white rounded-xl font-bold shadow-lg shadow-accent-500/20 hover:shadow-accent-500/30 transition-all text-sm flex items-center justify-center gap-2 cursor-pointer mt-6"
        >
          <span id="submit-btn-text">Masuk Sekarang</span>
          <i id="submit-btn-icon" data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>

      <!-- Toggle Mode -->
      <div class="text-center pt-4 border-t border-surface-100/50">
        <p class="text-sm text-surface-500 font-medium">
          <span id="toggle-text">Belum punya akun?</span>
          <button
            id="toggle-mode-btn"
            type="button"
            class="text-accent-500 hover:text-accent-600 font-bold ml-1 transition-colors outline-none cursor-pointer"
          >
            Daftar Baru
          </button>
        </p>
      </div>
    </div>

    <!-- Script to render Lucide icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>
    <!-- Login JS Logic -->
  </body>
</html>
