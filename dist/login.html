<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masuk - SekolahMu</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Tailwind CSS -->
    <script type="module" crossorigin src="/assets/login-B6S281ld.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/css-CNRzkIpI.js">
    <link rel="stylesheet" crossorigin href="/assets/css-VQ-JrWX8.css">
  </head>
  <body
    class="bg-surface-50 text-surface-900 font-sans antialiased min-h-screen flex items-center justify-center p-4 relative overflow-hidden"
  >
    <!-- Background dynamic mesh blobs -->
    <div
      class="absolute -top-40 -left-40 w-96 h-96 bg-amber-200/40 rounded-full blur-3xl -z-10 animate-pulse duration-4000"
    ></div>
    <div
      class="absolute -bottom-40 -right-40 w-96 h-96 bg-indigo-200/40 rounded-full blur-3xl -z-10 animate-pulse duration-6000"
    ></div>

    <div
      class="w-full max-w-lg bg-white/70 backdrop-blur-xl border border-white/80 shadow-xl rounded-3xl p-6 sm:p-8 space-y-6"
    >
      <!-- Logo Area & Header -->
      <div class="text-center space-y-2">
        <div
          class="inline-flex items-center gap-2 text-amber-500 font-bold text-2xl tracking-tight"
        >
          <i data-lucide="graduation-cap" class="w-8 h-8"></i>
          <span>Sekolah<span class="text-surface-900">Mu</span></span>
        </div>
        <h1 class="text-2xl font-bold text-surface-900 tracking-tight">
          Selamat Datang
        </h1>
        <p class="text-surface-500 text-sm">
          Masuk untuk memulai perjalanan belajarmu hari ini!
        </p>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="space-y-5">
        <!-- Input Username/Email -->
        <div class="space-y-1.5">
          <label for="username" class="text-sm font-semibold text-surface-700"
            >Username atau Email</label
          >
          <div class="relative flex items-center">
            <i
              data-lucide="user"
              class="w-4 h-4 absolute left-3.5 text-surface-400"
            ></i>
            <input
              type="text"
              id="username"
              required
              placeholder="Masukkan username Anda..."
              class="w-full pl-10 pr-4 py-2.5 bg-white/80 border border-surface-200 focus:border-amber-500 focus:ring-2 focus:ring-amber-200 rounded-xl text-sm outline-none transition-all shadow-sm"
            />
          </div>
        </div>

        <!-- Input Password -->
        <div class="space-y-1.5">
          <label for="password" class="text-sm font-semibold text-surface-700"
            >Kata Sandi</label
          >
          <div class="relative flex items-center">
            <i
              data-lucide="lock"
              class="w-4 h-4 absolute left-3.5 text-surface-400"
            ></i>
            <input
              type="password"
              id="password"
              required
              placeholder="••••••••"
              class="w-full pl-10 pr-4 py-2.5 bg-white/80 border border-surface-200 focus:border-amber-500 focus:ring-2 focus:ring-amber-200 rounded-xl text-sm outline-none transition-all shadow-sm"
            />
          </div>
        </div>

        <!-- Level Selector Cards -->
        <div class="space-y-2">
          <label class="text-sm font-semibold text-surface-700 block"
            >Pilih Tingkat Pendidikan</label
          >
          <div class="grid grid-cols-3 gap-3">
            <!-- SD Option -->
            <button
              type="button"
              data-level="sd"
              class="level-card flex flex-col items-center justify-center p-3 border-2 border-surface-200 hover:border-sky-400 rounded-2xl bg-white/50 hover:bg-sky-50/20 transition-all cursor-pointer group text-center"
            >
              <div
                class="p-2 bg-sky-100 rounded-xl mb-1.5 text-sky-500 group-hover:scale-110 transition-transform"
              >
                <i data-lucide="smile" class="w-5 h-5"></i>
              </div>
              <span class="text-xs font-bold text-surface-800"
                >Sekolah Dasar</span
              >
              <span class="text-[10px] text-surface-400 mt-0.5">SD</span>
            </button>

            <!-- SMK Option (Default selected) -->
            <button
              type="button"
              data-level="smk"
              class="level-card flex flex-col items-center justify-center p-3 border-2 border-amber-500 bg-amber-50/20 rounded-2xl transition-all cursor-pointer group text-center"
            >
              <div
                class="p-2 bg-amber-100 rounded-xl mb-1.5 text-amber-500 group-hover:scale-110 transition-transform"
              >
                <i data-lucide="book-open" class="w-5 h-5"></i>
              </div>
              <span class="text-xs font-bold text-surface-800"
                >SMP / SMA / K</span
              >
              <span class="text-[10px] text-surface-400 mt-0.5">SMK RPL</span>
            </button>

            <!-- Kuliah Option -->
            <button
              type="button"
              data-level="kuliah"
              class="level-card flex flex-col items-center justify-center p-3 border-2 border-surface-200 hover:border-indigo-400 rounded-2xl bg-white/50 hover:bg-indigo-50/20 transition-all cursor-pointer group text-center"
            >
              <div
                class="p-2 bg-indigo-100 rounded-xl mb-1.5 text-indigo-500 group-hover:scale-110 transition-transform"
              >
                <i data-lucide="graduation-cap" class="w-5 h-5"></i>
              </div>
              <span class="text-xs font-bold text-surface-800"
                >Perguruan Tinggi</span
              >
              <span class="text-[10px] text-surface-400 mt-0.5">Kuliah</span>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          id="submit-btn"
          class="w-full py-3 bg-amber-500 hover:bg-amber-600 active:scale-98 text-white rounded-xl font-semibold shadow-md transition-all text-sm flex items-center justify-center gap-2 cursor-pointer mt-6"
        >
          <span>Masuk Sekarang</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>
    </div>

    <!-- Script to render Lucide icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>
    <!-- Login JS Logic -->
  </body>
</html>
