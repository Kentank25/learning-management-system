<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalender Belajar - SekolahMu</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS -->

    <!-- Theme Selector Script -->
    <script>
      (function() {
        const state = JSON.parse(localStorage.getItem('sekolahmu_state') || '{}');
        const theme = state['edu-level'] || localStorage.getItem('edu-level') || 'smk';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <script type="module" crossorigin src="/assets/calendar-CcNDe5h8.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/store-JTud2RYC.js">
    <link rel="modulepreload" crossorigin href="/assets/buddy-BeuqbOLB.js">
    <link rel="stylesheet" crossorigin href="/assets/store-B0plcS47.css">
  </head>
  <body
    class="bg-surface-50 text-surface-900 font-sans antialiased h-screen flex overflow-hidden relative"
  >
    <!-- Background dynamic mesh blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <!-- Sidebar Overlay -->
    <div
      id="sidebar-overlay"
      class="fixed inset-0 bg-black/50 z-20 hidden md:hidden transition-opacity duration-300 opacity-0"
    ></div>

    <!-- Sidebar (Moodle-like Navigation) -->
    <aside
      id="sidebar"
      class="w-64 glass-panel border-r border-white/30 flex flex-col fixed inset-y-0 left-0 transform -translate-x-full md:relative md:translate-x-0 transition-all duration-300 z-30 shadow-xl"
    ></aside>

    <!-- Main Wrapper -->
    <div class="flex-1 flex flex-col h-full overflow-hidden relative z-10">
      <!-- Header / Topbar -->
      <header
        id="header"
        class="h-16 glass-panel border-b border-white/30 flex items-center justify-between px-4 sm:px-6 z-35 shadow-sm relative"
      ></header>

      <!-- Main Content Scrollable Area: Calendar -->
      <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
        <div class="max-w-7xl mx-auto space-y-6">
          
          <!-- Page Header -->
          <div>
            <h1 id="calendar-page-title" class="text-2xl font-bold text-surface-900 font-display">
              Kalender Belajar
            </h1>
            <p id="calendar-page-desc" class="text-surface-500 text-sm mt-1">
              Pantau jadwal belajar, agenda, dan tugas yang harus dikerjakan.
            </p>
          </div>

          <!-- Two Column Grid for Calendar -->
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Left & Middle Column: Interactive Month Grid (Spans 2 columns on lg) -->
            <div class="lg:col-span-2 space-y-4">
              <div class="glass-panel rounded-2xl p-5 shadow-sm space-y-4 hover-lift">
                <!-- Month & Nav Controls -->
                <div class="flex items-center justify-between">
                  <h2 id="calendar-month-year" class="text-lg font-bold text-surface-900 font-display">
                    Mei 2026
                  </h2>
                  <div class="flex items-center gap-1">
                    <button id="prev-month-btn" class="p-2 hover:bg-white/50 rounded-xl text-surface-500 transition-colors border-none cursor-pointer">
                      <i data-lucide="chevron-left" class="w-5 h-5"></i>
                    </button>
                    <button id="next-month-btn" class="p-2 hover:bg-white/50 rounded-xl text-surface-500 transition-colors border-none cursor-pointer">
                      <i data-lucide="chevron-right" class="w-5 h-5"></i>
                    </button>
                  </div>
                </div>

                <!-- Calendar Week Header -->
                <div class="grid grid-cols-7 gap-1 text-center text-xs font-bold text-surface-400 uppercase tracking-wider">
                  <div class="text-red-500 font-display">Min</div>
                  <div class="font-display">Sen</div>
                  <div class="font-display">Sel</div>
                  <div class="font-display">Rab</div>
                  <div class="font-display">Kam</div>
                  <div class="font-display">Jum</div>
                  <div class="font-display">Sab</div>
                </div>

                <!-- Calendar Days Grid -->
                <div id="calendar-grid" class="grid grid-cols-7 gap-2">
                  <!-- Rendered dynamically by calendar.js -->
                </div>

                <!-- Calendar Legends -->
                <div class="border-t border-surface-100/50 pt-4 flex flex-wrap gap-4 text-xs font-medium text-surface-500">
                  <span class="flex items-center gap-1.5">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block"></span>
                    Kelas Virtual / Sesi Belajar
                  </span>
                  <span class="flex items-center gap-1.5">
                    <span class="w-2.5 h-2.5 rounded-full bg-orange-500 inline-block"></span>
                    Tenggat Tugas / Deadline
                  </span>
                  <span class="flex items-center gap-1.5">
                    <span class="w-2.5 h-2.5 rounded-full bg-indigo-500 inline-block"></span>
                    Ujian / Acara Khusus
                  </span>
                </div>
              </div>
            </div>

            <!-- Right Column: Selected Date Agendas Panel -->
            <div class="space-y-4">
              <div class="glass-panel rounded-2xl p-5 shadow-sm flex flex-col h-full min-h-[400px] hover-lift">
                <div class="border-b border-surface-100/50 pb-4 mb-4 flex items-center justify-between">
                  <div>
                    <h3 class="font-bold text-surface-900 text-base font-display">Agenda Kegiatan</h3>
                    <p id="selected-date-str" class="text-xs text-surface-500 mt-0.5">Kamis, 21 Mei 2026</p>
                  </div>
                  <i data-lucide="calendar-days" class="w-5 h-5 text-accent-500"></i>
                </div>

                <!-- Agenda Items Container -->
                <div id="agenda-container" class="flex-1 space-y-3 overflow-y-auto max-h-[300px] pr-1">
                  <!-- Rendered dynamically by calendar.js -->
                </div>

                <!-- Action Button -->
                <button
                  id="add-agenda-btn"
                  class="w-full mt-4 py-3 bg-accent-500 hover:bg-accent-600 text-white font-bold rounded-xl text-sm transition-all shadow-md flex items-center justify-center gap-2 cursor-pointer active:scale-98 border-none"
                >
                  <i data-lucide="plus" class="w-4 h-4"></i>
                  Tambah Agenda Baru
                </button>
              </div>
            </div>
          </div>

        </div>
      </main>
    </div>

    <!-- Agenda Modal (Hidden by default) -->
    <div
      id="agenda-modal"
      class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300"
    >
      <div class="glass-panel w-full max-w-md rounded-2xl shadow-2xl overflow-hidden transform scale-95 transition-transform duration-300">
        <div class="px-6 py-4 border-b border-surface-100/50 flex justify-between items-center bg-white/30">
          <h3 class="font-bold text-surface-900 text-base flex items-center gap-2 font-display">
            <i data-lucide="calendar-plus" class="w-5 h-5 text-accent-500"></i>
            Tambah Agenda Baru
          </h3>
          <button id="close-modal-btn" class="p-1.5 text-surface-400 hover:text-surface-600 hover:bg-white/50 rounded-lg transition-colors border-none cursor-pointer">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>

        <form id="agenda-form" class="p-6 space-y-4">
          <div class="space-y-1">
            <label for="agenda-title" class="text-xs font-semibold text-surface-700">Nama Kegiatan</label>
            <input
              type="text"
              id="agenda-title"
              required
              placeholder="Contoh: Belajar Kelompok Basis Data..."
              class="w-full px-3 py-2.5 bg-white/60 border border-surface-200/50 focus:bg-white focus:border-accent-500 focus:ring-4 focus:ring-accent-100 rounded-xl text-sm outline-none transition-all"
            />
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div class="space-y-1">
              <label for="agenda-date" class="text-xs font-semibold text-surface-700">Tanggal</label>
              <input
                type="date"
                id="agenda-date"
                required
                class="w-full px-3 py-2.5 bg-white/60 border border-surface-200/50 focus:bg-white focus:border-accent-500 focus:ring-4 focus:ring-accent-100 rounded-xl text-sm outline-none transition-all"
              />
            </div>
            <div class="space-y-1">
              <label for="agenda-time" class="text-xs font-semibold text-surface-700">Waktu (WIB)</label>
              <input
                type="time"
                id="agenda-time"
                required
                class="w-full px-3 py-2.5 bg-white/60 border border-surface-200/50 focus:bg-white focus:border-accent-500 focus:ring-4 focus:ring-accent-100 rounded-xl text-sm outline-none transition-all"
              />
            </div>
          </div>

          <div class="space-y-1">
            <label for="agenda-type" class="text-xs font-semibold text-surface-700">Kategori</label>
            <select
              id="agenda-type"
              required
              class="w-full px-3 py-2.5 bg-white/60 border border-surface-200/50 focus:bg-white focus:border-accent-500 focus:ring-4 focus:ring-accent-100 rounded-xl text-sm outline-none transition-all cursor-pointer"
            >
              <option value="class">Kelas Virtual / Sesi Belajar</option>
              <option value="deadline">Tenggat Tugas / Deadline</option>
              <option value="event">Ujian / Acara Khusus</option>
            </select>
          </div>

          <button
            type="submit"
            class="w-full py-3 bg-accent-500 hover:bg-accent-600 text-white font-bold rounded-xl text-sm transition-all shadow-md flex items-center justify-center gap-2 cursor-pointer active:scale-98 border-none mt-2"
          >
            Simpan Kegiatan
          </button>
        </form>
      </div>
    </div>

    <!-- Script to render Lucide icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Custom JS Modules -->
  </body>
</html>
