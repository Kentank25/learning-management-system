<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>File Pribadi - SekolahMu</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS -->

    <!-- Theme Selector Script -->
    <script>
      (function() {
        const state = JSON.parse(localStorage.getItem('sekolahmu_state') || '{}');
        const theme = state['edu-level'] || localStorage.getItem('edu-level') || 'smk';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <script type="module" crossorigin src="/assets/files-BkQTipvm.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/supabaseClient-BV95uWoo.js">
    <link rel="modulepreload" crossorigin href="/assets/main-CQqB_fRi.js">
    <link rel="modulepreload" crossorigin href="/assets/buddy-8KuxTPFi.js">
    <link rel="stylesheet" crossorigin href="/assets/supabaseClient-D3Kj3cBN.css">
  </head>
  <body
    class="bg-surface-50 text-surface-900 font-sans antialiased h-screen flex overflow-hidden relative"
  >
    <!-- Background dynamic mesh blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <!-- Sidebar Overlay -->
    <div
      id="sidebar-overlay"
      class="fixed inset-0 bg-black/50 z-20 hidden md:hidden transition-opacity duration-300 opacity-0"
    ></div>

    <!-- Sidebar (Moodle-like Navigation) -->
    <aside
      id="sidebar"
      class="w-64 glass-panel border-r border-white/30 flex flex-col fixed inset-y-0 left-0 transform -translate-x-full md:relative md:translate-x-0 transition-all duration-300 z-30 shadow-xl"
    ></aside>

    <!-- Main Wrapper -->
    <div class="flex-1 flex flex-col h-full overflow-hidden relative z-10">
      <!-- Header / Topbar -->
      <header
        id="header"
        class="h-16 glass-panel border-b border-white/30 flex items-center justify-between px-4 sm:px-6 z-35 shadow-sm relative"
      ></header>

      <!-- Main Content Scrollable Area: Files Panel -->
      <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
        <div class="max-w-7xl mx-auto space-y-6">
          
          <!-- Page Header -->
          <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div>
              <h1 id="files-page-title" class="text-2xl font-bold text-surface-900 font-display">
                Penyimpanan File Pribadi
              </h1>
              <p id="files-page-desc" class="text-surface-500 text-sm mt-1">
                Kelola berkas tugas, draf modul, dan sertifikasi digital Anda secara mandiri.
              </p>
            </div>
            
            <!-- Upload Mock Button -->
            <div>
              <button
                id="upload-file-trigger"
                class="px-4 py-3 bg-accent-500 hover:bg-accent-600 text-white font-bold rounded-xl text-sm shadow-md shadow-accent-500/10 hover:shadow-accent-500/20 active:scale-98 transition-all flex items-center gap-2 cursor-pointer border-none"
              >
                <i data-lucide="upload" class="w-4 h-4"></i>
                <span>Unggah Berkas Baru</span>
              </button>
              <!-- Hidden input file -->
              <input type="file" id="files-hidden-input" class="hidden" />
            </div>
          </div>

          <!-- Dynamic Files Content Area -->
          <div id="files-content-area" class="space-y-6">
            <!-- Injected dynamically by files.js -->
          </div>

        </div>
      </main>
    </div>

    <!-- Script to render Lucide icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Custom JS Modules -->
  </body>
</html>
