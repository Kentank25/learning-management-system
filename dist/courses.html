<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mata Pelajaran - SekolahMu</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS -->

    <!-- Theme Selector Script -->
    <script>
      (function() {
        const state = JSON.parse(localStorage.getItem('sekolahmu_state') || '{}');
        const theme = state['edu-level'] || localStorage.getItem('edu-level') || 'smk';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <script type="module" crossorigin src="/assets/courses-nB2SmUv6.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/store-5R8oxc92.js">
    <link rel="modulepreload" crossorigin href="/assets/buddy-CvtKqBNh.js">
    <link rel="stylesheet" crossorigin href="/assets/store-D7cHBOnK.css">
  </head>
  <body
    class="bg-surface-50 text-surface-900 font-sans antialiased h-screen flex overflow-hidden relative"
  >
    <!-- Background dynamic mesh blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <!-- Sidebar Overlay -->
    <div
      id="sidebar-overlay"
      class="fixed inset-0 bg-black/50 z-20 hidden md:hidden transition-opacity duration-300 opacity-0"
    ></div>

    <!-- Sidebar (Moodle-like Navigation) -->
    <aside
      id="sidebar"
      class="w-64 glass-panel border-r border-white/30 flex flex-col fixed inset-y-0 left-0 transform -translate-x-full md:relative md:translate-x-0 transition-all duration-300 z-30 shadow-xl"
    ></aside>

    <!-- Main Wrapper -->
    <div class="flex-1 flex flex-col h-full overflow-hidden relative z-10">
      <!-- Header / Topbar -->
      <header
        id="header"
        class="h-16 glass-panel border-b border-white/30 flex items-center justify-between px-4 sm:px-6 z-35 shadow-sm relative"
      ></header>

      <!-- Main Content Scrollable Area: Courses -->
      <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
        <div class="max-w-7xl mx-auto space-y-8">
          <!-- Page Header & Filters -->
          <div
            class="flex flex-col sm:flex-row sm:items-center justify-between gap-4"
          >
            <div>
              <h1 id="courses-page-title" class="text-2xl font-bold text-surface-900 font-display">
                Mata Pelajaran
              </h1>
              <p id="courses-page-desc" class="text-surface-500 text-sm mt-1">
                Pilih kelas Anda untuk melanjutkan pembelajaran.
              </p>
            </div>

            <div class="flex items-center gap-3">
              <!-- Filter Tabs -->
              <div
                id="course-filters"
                class="glass-panel border border-surface-200/50 rounded-xl p-1 flex text-sm font-medium shadow-sm"
              >
                <button
                  data-filter="all"
                  class="filter-btn px-4 py-1.5 bg-accent-100 text-accent-700 rounded-lg transition-all cursor-pointer border-none"
                >
                  Semua
                </button>
                <button
                  data-filter="ongoing"
                  class="filter-btn px-4 py-1.5 text-surface-600 hover:text-surface-900 hover:bg-white/50 rounded-lg transition-all cursor-pointer border-none"
                >
                  Sedang Berjalan
                </button>
                <button
                  data-filter="completed"
                  class="filter-btn px-4 py-1.5 text-surface-600 hover:text-surface-900 hover:bg-white/50 rounded-lg transition-all cursor-pointer border-none"
                >
                  Selesai
                </button>
              </div>

              <!-- Sort Button -->
              <button
                class="p-2 glass-panel text-surface-600 hover:text-surface-900 rounded-xl shadow-sm transition-colors flex items-center gap-2 text-sm font-medium cursor-pointer border-none"
              >
                <i data-lucide="sliders-horizontal" class="w-4 h-4"></i>
                <span class="hidden sm:inline">Filter</span>
              </button>
            </div>
          </div>

          <!-- Course Grid -->
          <div
            id="courses-grid"
            class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"
          >
            <!-- Dirender secara dinamis oleh courses.js -->
          </div>
        </div>
      </main>
    </div>

    <!-- Script to render Lucide icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Custom JS -->
  </body>
</html>
