<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nilai & Rapor - SekolahMu</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS -->

    <!-- Theme Selector Script -->
    <script>
      (function() {
        const state = JSON.parse(localStorage.getItem('sekolahmu_state') || '{}');
        const theme = state['edu-level'] || localStorage.getItem('edu-level') || 'smk';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <script type="module" crossorigin src="/assets/grades-6ymhVZc9.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/supabaseClient-sLxbxkzy.js">
    <link rel="modulepreload" crossorigin href="/assets/main-D_hrPE_v.js">
    <link rel="modulepreload" crossorigin href="/assets/buddy-B-pw8LLq.js">
    <link rel="stylesheet" crossorigin href="/assets/supabaseClient-CIr_Ikd3.css">
  </head>
  <body
    class="bg-surface-50 text-surface-900 font-sans antialiased h-screen flex overflow-hidden relative"
  >
    <!-- Background dynamic mesh blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <!-- Sidebar Overlay -->
    <div
      id="sidebar-overlay"
      class="fixed inset-0 bg-black/50 z-20 hidden md:hidden transition-opacity duration-300 opacity-0"
    ></div>

    <!-- Sidebar (Moodle-like Navigation) -->
    <aside
      id="sidebar"
      class="w-64 glass-panel border-r border-white/30 flex flex-col fixed inset-y-0 left-0 transform -translate-x-full md:relative md:translate-x-0 transition-all duration-300 z-30 shadow-xl"
    ></aside>

    <!-- Main Wrapper -->
    <div class="flex-1 flex flex-col h-full overflow-hidden relative z-10">
      <!-- Header / Topbar -->
      <header
        id="header"
        class="h-16 glass-panel border-b border-white/30 flex items-center justify-between px-4 sm:px-6 z-35 shadow-sm relative"
      ></header>

      <!-- Main Content Scrollable Area: Grades Panel -->
      <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
        <div class="max-w-7xl mx-auto space-y-6">
          
          <!-- Page Header -->
          <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div>
              <h1 id="grades-page-title" class="text-2xl font-bold text-surface-900 font-display">
                Nilai & Rapor Belajar
              </h1>
              <p id="grades-page-desc" class="text-surface-500 text-sm mt-1">
                Pantau riwayat akademik, hasil kuis, dan transkrip kelulusan Anda.
              </p>
            </div>
            
            <!-- Dynamic Semester Dropdown (Kuliah Only) -->
            <div id="semester-filter-container" class="hidden">
              <select
                id="semester-select"
                class="px-4 py-2.5 bg-white/60 border border-surface-200/50 rounded-xl text-sm font-semibold outline-none transition-all focus:bg-white focus:ring-4 focus:ring-indigo-150 focus:border-indigo-500 cursor-pointer"
              >
                <option value="all">Semua Semester</option>
                <option value="1">Semester 1</option>
                <option value="2">Semester 2</option>
                <option value="3">Semester 3</option>
                <option value="4" selected>Semester 4 (Aktif)</option>
              </select>
            </div>
          </div>

          <!-- Dynamic Content Render Area -->
          <div id="grades-content-area" class="space-y-6">
            <!-- Injected dynamically by grades.js -->
          </div>

        </div>
      </main>
    </div>

    <!-- Script to render Lucide icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Custom JS Modules -->
  </body>
</html>
