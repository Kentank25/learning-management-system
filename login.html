<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masuk - SekolahMu</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="/src/css/index.css" />
  </head>
  <body
    class="bg-surface-50 text-surface-900 font-sans antialiased min-h-screen flex items-center justify-center p-4 relative overflow-hidden"
  >
    <!-- Background dynamic mesh blobs -->
    <div
      class="absolute -top-48 -left-48 w-[500px] h-[500px] bg-gradient-to-tr from-amber-400/20 to-orange-500/20 rounded-full blur-[100px] -z-10 animate-pulse duration-4000 pointer-events-none"
    ></div>
    <div
      class="absolute -bottom-48 -right-48 w-[500px] h-[500px] bg-gradient-to-tr from-indigo-500/20 to-violet-600/20 rounded-full blur-[100px] -z-10 animate-pulse duration-6000 pointer-events-none"
    ></div>

    <div
      class="w-full max-w-lg bg-white/60 backdrop-blur-2xl border border-white/80 shadow-[0_20px_50px_rgba(0,0,0,0.08)] rounded-3xl p-8 space-y-6 relative overflow-hidden"
    >
      <!-- Logo Area & Header -->
      <div class="text-center space-y-2">
        <div
          class="inline-flex items-center gap-2 text-amber-500 font-extrabold text-2xl tracking-tight font-display"
        >
          <i data-lucide="graduation-cap" class="w-8 h-8"></i>
          <span>Sekolah<span class="text-surface-900">Mu</span></span>
        </div>
        <h1 class="text-3xl font-extrabold text-surface-900 tracking-tight font-display">
          Selamat Datang
        </h1>
        <p class="text-surface-500 text-sm font-medium">
          Masuk untuk memulai perjalanan belajarmu hari ini!
        </p>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="space-y-5">
        <!-- Input Username/Email -->
        <div class="space-y-1.5">
          <label for="username" class="text-xs font-bold uppercase tracking-wider text-surface-600"
            >Username atau Email</label
          >
          <div class="relative flex items-center">
            <i
              data-lucide="user"
              class="w-4 h-4 absolute left-3.5 text-surface-400"
            ></i>
            <input
              type="text"
              id="username"
              required
              placeholder="Masukkan username Anda..."
              class="w-full pl-10 pr-4 py-3 bg-white/80 border border-surface-200/80 focus:border-amber-500 focus:ring-4 focus:ring-amber-100 rounded-xl text-sm outline-none transition-all shadow-sm"
            />
          </div>
        </div>

        <!-- Input Password -->
        <div class="space-y-1.5">
          <label for="password" class="text-xs font-bold uppercase tracking-wider text-surface-600"
            >Kata Sandi</label
          >
          <div class="relative flex items-center">
            <i
              data-lucide="lock"
              class="w-4 h-4 absolute left-3.5 text-surface-400"
            ></i>
            <input
              type="password"
              id="password"
              required
              placeholder="••••••••"
              class="w-full pl-10 pr-4 py-3 bg-white/80 border border-surface-200/80 focus:border-amber-500 focus:ring-4 focus:ring-amber-100 rounded-xl text-sm outline-none transition-all shadow-sm"
            />
          </div>
        </div>

        <!-- Level Selector Cards -->
        <div class="space-y-2">
          <label class="text-xs font-bold uppercase tracking-wider text-surface-600 block"
            >Pilih Tingkat Pendidikan</label
          >
          <div class="grid grid-cols-3 gap-3">
            <!-- SD Option -->
            <button
              type="button"
              data-level="sd"
              class="level-card hover-lift flex flex-col items-center justify-center p-3 border-2 border-surface-200 hover:border-sky-400 rounded-2xl bg-white/40 hover:bg-white/80 transition-all cursor-pointer group text-center"
            >
              <div
                class="p-2 bg-sky-100/80 rounded-xl mb-1.5 text-sky-500 group-hover:scale-110 transition-transform"
              >
                <i data-lucide="smile" class="w-5 h-5"></i>
              </div>
              <span class="text-xs font-bold text-surface-850"
                >Sekolah Dasar</span
              >
              <span class="text-[9px] font-bold text-surface-400 mt-0.5">SD</span>
            </button>

            <!-- SMK Option (Default selected) -->
            <button
              type="button"
              data-level="smk"
              class="level-card hover-lift flex flex-col items-center justify-center p-3 border-2 border-amber-500 bg-amber-50/20 rounded-2xl transition-all cursor-pointer group text-center"
            >
              <div
                class="p-2 bg-amber-100/80 rounded-xl mb-1.5 text-amber-500 group-hover:scale-110 transition-transform"
              >
                <i data-lucide="book-open" class="w-5 h-5"></i>
              </div>
              <span class="text-xs font-bold text-surface-850"
                >SMP / SMA / K</span
              >
              <span class="text-[9px] font-bold text-surface-400 mt-0.5">SMK RPL</span>
            </button>

            <!-- Kuliah Option -->
            <button
              type="button"
              data-level="kuliah"
              class="level-card hover-lift flex flex-col items-center justify-center p-3 border-2 border-surface-200 hover:border-indigo-400 rounded-2xl bg-white/40 hover:bg-white/80 transition-all cursor-pointer group text-center"
            >
              <div
                class="p-2 bg-indigo-100/80 rounded-xl mb-1.5 text-indigo-500 group-hover:scale-110 transition-transform"
              >
                <i data-lucide="graduation-cap" class="w-5 h-5"></i>
              </div>
              <span class="text-xs font-bold text-surface-850"
                >Perguruan Tinggi</span
              >
              <span class="text-[9px] font-bold text-surface-400 mt-0.5">Kuliah</span>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          id="submit-btn"
          class="w-full py-3 bg-amber-500 hover:bg-amber-600 active:scale-98 text-white rounded-xl font-bold shadow-md transition-all text-sm flex items-center justify-center gap-2 cursor-pointer mt-6"
        >
          <span>Masuk Sekarang</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>
    </div>

    <!-- Script to render Lucide icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>
    <!-- Login JS Logic -->
    <script src="/src/js/login.js" type="module"></script>
  </body>
</html>
