<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel - SekolahMu</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="/src/css/index.css" />

    <!-- Theme Selector Script -->
    <script>
      (function() {
        const state = JSON.parse(localStorage.getItem('sekolahmu_state') || '{}');
        const theme = state['edu-level'] || localStorage.getItem('edu-level') || 'smk';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body
    class="bg-surface-50 text-surface-900 font-sans antialiased h-screen flex overflow-hidden relative"
  >
    <!-- Background dynamic mesh blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <!-- Sidebar Overlay -->
    <div
      id="sidebar-overlay"
      class="fixed inset-0 bg-black/50 z-20 hidden md:hidden transition-opacity duration-300 opacity-0"
    ></div>

    <!-- Sidebar (Modular Navigation) -->
    <aside
      id="sidebar"
      class="w-64 glass-panel border-r border-white/30 flex flex-col fixed inset-y-0 left-0 transform -translate-x-full md:relative md:translate-x-0 transition-all duration-300 z-30 shadow-xl"
    ></aside>

    <!-- Main Wrapper -->
    <div class="flex-1 flex flex-col h-full overflow-hidden relative z-10">
      <!-- Header / Topbar -->
      <header
        id="header"
        class="h-16 glass-panel border-b border-white/30 flex items-center justify-between px-4 sm:px-6 z-35 shadow-sm relative"
      ></header>

      <!-- Main Content Scrollable Area -->
      <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
        <div class="max-w-7xl mx-auto space-y-6">
          
          <!-- Page Header -->
          <div>
            <h1 class="text-2xl font-bold text-surface-900 font-display flex items-center gap-2">
              <i data-lucide="shield-alert" class="w-7 h-7 text-accent-500"></i>
              <span>Panel Kontrol Administrator</span>
            </h1>
            <p class="text-surface-500 text-sm mt-1">
              Kelola peran pengguna (is_admin) dan tingkat pendidikan (edu_level) SekolahMu LMS.
            </p>
          </div>

          <!-- Controls Panel (Search & Filters) -->
          <div class="glass-panel p-5 rounded-2xl border border-white/30 flex flex-col md:flex-row gap-4 justify-between items-stretch md:items-center shadow-sm">
            <!-- Search -->
            <div class="relative flex items-center flex-1 max-w-md">
              <i data-lucide="search" class="w-4 h-4 absolute left-3.5 text-surface-400"></i>
              <input
                type="text"
                id="search-users"
                placeholder="Cari pengguna berdasarkan nama atau email..."
                class="w-full pl-10 pr-4 py-2.5 bg-white/60 border border-surface-200/50 focus:border-accent-500 focus:ring-4 focus:ring-accent-100 rounded-xl text-sm outline-none transition-all shadow-sm"
              />
            </div>

            <!-- Filters -->
            <div class="flex flex-wrap items-center gap-3">
              <!-- Filter Jenjang -->
              <div class="flex items-center gap-2">
                <label for="filter-level" class="text-xs font-bold text-surface-500 uppercase tracking-wide">Jenjang:</label>
                <select
                  id="filter-level"
                  class="px-3 py-2 bg-white/60 border border-surface-200/50 rounded-xl text-xs font-semibold outline-none focus:ring-2 focus:ring-accent-100 transition-all cursor-pointer"
                >
                  <option value="all">Semua Jenjang</option>
                  <option value="sd">Sekolah Dasar (SD)</option>
                  <option value="smk">Sekolah Menengah (SMK)</option>
                  <option value="kuliah">Kuliah / Universitas</option>
                </select>
              </div>

              <!-- Filter Peran -->
              <div class="flex items-center gap-2">
                <label for="filter-role" class="text-xs font-bold text-surface-500 uppercase tracking-wide">Peran:</label>
                <select
                  id="filter-role"
                  class="px-3 py-2 bg-white/60 border border-surface-200/50 rounded-xl text-xs font-semibold outline-none focus:ring-2 focus:ring-accent-100 transition-all cursor-pointer"
                >
                  <option value="all">Semua Peran</option>
                  <option value="admin">Administrator</option>
                  <option value="user">Siswa/Mahasiswa</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Users List Card -->
          <div class="glass-panel rounded-2xl border border-white/30 overflow-hidden shadow-sm">
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="border-b border-surface-200/50 bg-white/30 text-surface-500 text-xs font-bold uppercase tracking-wider">
                    <th class="px-6 py-4">Nama Pengguna</th>
                    <th class="px-6 py-4">Alamat Email</th>
                    <th class="px-6 py-4">Jenjang Pendidikan</th>
                    <th class="px-6 py-4">Status Administrator</th>
                    <th class="px-6 py-4 text-center">Aksi / Status</th>
                  </tr>
                </thead>
                <tbody id="users-table-body" class="divide-y divide-surface-100/50 text-sm">
                  <!-- Loading State -->
                  <tr>
                    <td colspan="5" class="px-6 py-12 text-center text-surface-500">
                      <div class="flex flex-col items-center gap-3">
                        <i data-lucide="loader-2" class="w-8 h-8 text-accent-500 animate-spin"></i>
                        <span class="font-medium">Memuat data pengguna...</span>
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

        </div>
      </main>
    </div>

    <!-- Floating Toast Container for Alerts -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-60 space-y-3 pointer-events-none"></div>

    <!-- Script to render Lucide icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Custom JS Modules -->
    <script type="module" src="/src/js/main.js"></script>
    <script type="module" src="/src/js/admin.js"></script>
  </body>
</html>
